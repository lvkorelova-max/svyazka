services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-svyazka}
      POSTGRES_USER: ${POSTGRES_USER:-svyazka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_test_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-svyazka} -d ${POSTGRES_DB:-svyazka}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-svyazka_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local_minio_secret_change_me}
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-svyazka_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local_minio_secret_change_me}
      S3_BUCKET: ${S3_BUCKET:-creator-kit}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 \"$${S3_ACCESS_KEY}\" \"$${S3_SECRET_KEY}\"; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/$${S3_BUCKET};
      /usr/bin/mc anonymous set none local/$${S3_BUCKET};
      "

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://svyazka:local_test_password@db:5432/svyazka?schema=public}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql://svyazka:local_test_password@db:5432/svyazka_test?schema=public}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app/frontend

volumes:
  postgres_data:
  minio_data:
