name: svyazka-production

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: *service-defaults
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,uid=70,gid=70,mode=775
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: 1.0

  minio:
    <<: *service-defaults
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${DOMAIN}
    volumes:
      - minio_prod_data:/data
    networks: [data, app]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: 1.0

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: >
      /bin/sh -eu -c '
      mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}";
      mc mb --ignore-existing local/"$${S3_BUCKET}";
      mc anonymous set none local/"$${S3_BUCKET}";
      '
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

  migration:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      target: build
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    command: ["npx", "prisma", "migrate", "deploy"]
    working_dir: /app/backend
    user: node
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: "no"
    mem_limit: 512m
    cpus: 0.5

  backend:
    <<: *service-defaults
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-svyazka_refresh}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      FRONTEND_ORIGIN: https://${DOMAIN}
      PUBLIC_BACKEND_URL: https://${DOMAIN}
      CLICK_IP_HASH_SALT: ${CLICK_IP_HASH_SALT}
      COMMISSION_HOLD_DAYS: ${COMMISSION_HOLD_DAYS:-14}
      ORDER_IMPORT_MAX_BYTES: ${ORDER_IMPORT_MAX_BYTES:-10485760}
      ORDER_IMPORT_MAX_ROWS: ${ORDER_IMPORT_MAX_ROWS:-10000}
      PLATFORM_COMMISSION_BPS: ${PLATFORM_COMMISSION_BPS:-500}
      S3_ENDPOINT_INTERNAL: http://minio:9000
      S3_ENDPOINT_PUBLIC: https://files.${DOMAIN}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-creator-kit}
      S3_UPLOAD_URL_TTL_SECONDS: ${S3_UPLOAD_URL_TTL_SECONDS:-600}
      S3_DOWNLOAD_URL_TTL_SECONDS: ${S3_DOWNLOAD_URL_TTL_SECONDS:-300}
      CREATOR_KIT_MAX_ASSETS: ${CREATOR_KIT_MAX_ASSETS:-100}
      CREATOR_KIT_MAX_IMAGE_BYTES: ${CREATOR_KIT_MAX_IMAGE_BYTES:-26214400}
      CREATOR_KIT_MAX_VIDEO_BYTES: ${CREATOR_KIT_MAX_VIDEO_BYTES:-524288000}
      CREATOR_KIT_MAX_DOCUMENT_BYTES: ${CREATOR_KIT_MAX_DOCUMENT_BYTES:-26214400}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      PASSWORD_RESET_EXPOSE_TOKEN: "false"
      PASSWORD_RESET_WEBHOOK_URL: ${PASSWORD_RESET_WEBHOOK_URL:-}
      PASSWORD_RESET_WEBHOOK_SECRET: ${PASSWORD_RESET_WEBHOOK_SECRET:-}
      MFA_CHALLENGE_TTL_SECONDS: ${MFA_CHALLENGE_TTL_SECONDS:-300}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      MFA_RECOVERY_CODE_SALT: ${MFA_RECOVERY_CODE_SALT}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      ADMIN_MFA_REQUIRED: "true"
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      CRITICAL_ALERT_WEBHOOK_URL: ${CRITICAL_ALERT_WEBHOOK_URL:-}
      CRITICAL_ALERT_WEBHOOK_SECRET: ${CRITICAL_ALERT_WEBHOOK_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      migration:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks: [app, data, egress]
    read_only: true
    tmpfs:
      - /tmp:size=128m,uid=1000,gid=1000,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0

  frontend:
    <<: *service-defaults
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_URL: /api
    networks: [app]
    read_only: true
    tmpfs:
      - /tmp:size=16m,uid=101,gid=101,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=755
      - /var/run:size=4m,uid=101,gid=101,mode=755
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/internal-health"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 128m
    cpus: 0.5

  caddy:
    <<: *service-defaults
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_HSTS_FILE:-./ops/caddy/hsts.disabled}:/etc/caddy/hsts:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, app]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.5

  backup-service:
    <<: *service-defaults
    profiles: [backup]
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_RETENTION_ENABLED: ${BACKUP_RETENTION_ENABLED:-false}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      S3_ENDPOINT_INTERNAL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-creator-kit}
    depends_on:
      migration:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=10001,gid=10001,mode=1777
    volumes:
      - backup_repository:/repository
      - backup_staging:/staging
      - backup_restore:/restore
      - backup_cache:/cache
    healthcheck:
      test: ["CMD", "restic", "snapshots", "--compact"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 2m
    mem_limit: 768m
    cpus: 0.75

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
  egress:

volumes:
  postgres_prod_data:
  minio_prod_data:
  caddy_data:
  caddy_config:
  backup_repository:
  backup_staging:
  backup_restore:
  backup_cache:
