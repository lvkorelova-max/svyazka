name: svyazka-recovery

services:
  recovery-db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${RECOVERY_POSTGRES_DB:-svyazka_recovery}
      POSTGRES_USER: ${RECOVERY_POSTGRES_USER:-svyazka_recovery}
      POSTGRES_PASSWORD: ${RECOVERY_POSTGRES_PASSWORD:-recovery_only_password}
    volumes:
      - recovery_postgres_data:/var/lib/postgresql/data
    networks: [recovery]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  recovery-minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${RECOVERY_S3_ACCESS_KEY:-recovery_minio}
      MINIO_ROOT_PASSWORD: ${RECOVERY_S3_SECRET_KEY:-recovery_minio_secret}
    volumes:
      - recovery_minio_data:/data
    networks: [recovery]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  recovery-minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      recovery-minio:
        condition: service_healthy
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      ACCESS_KEY: ${RECOVERY_S3_ACCESS_KEY:-recovery_minio}
      SECRET_KEY: ${RECOVERY_S3_SECRET_KEY:-recovery_minio_secret}
      BUCKET: ${RECOVERY_S3_BUCKET:-creator-kit-recovery}
    entrypoint: >
      /bin/sh -eu -c '
      mc alias set recovery http://recovery-minio:9000 "$${ACCESS_KEY}" "$${SECRET_KEY}";
      mc mb --ignore-existing recovery/"$${BUCKET}";
      mc anonymous set none recovery/"$${BUCKET}";
      '
    networks: [recovery]
    tmpfs: [/tmp]

  recovery-tool:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    entrypoint: ["/bin/bash"]
    environment:
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      RESTORE_ENVIRONMENT: recovery
      TARGET_DATABASE_NAME: ${RECOVERY_POSTGRES_DB:-svyazka_recovery}
      TARGET_DATABASE_URL: postgresql://${RECOVERY_POSTGRES_USER:-svyazka_recovery}:${RECOVERY_POSTGRES_PASSWORD:-recovery_only_password}@recovery-db:5432/${RECOVERY_POSTGRES_DB:-svyazka_recovery}
      TARGET_S3_ENDPOINT: http://recovery-minio:9000
      TARGET_S3_ACCESS_KEY: ${RECOVERY_S3_ACCESS_KEY:-recovery_minio}
      TARGET_S3_SECRET_KEY: ${RECOVERY_S3_SECRET_KEY:-recovery_minio_secret}
      TARGET_S3_BUCKET: ${RECOVERY_S3_BUCKET:-creator-kit-recovery}
    depends_on:
      recovery-db:
        condition: service_healthy
      recovery-minio-init:
        condition: service_completed_successfully
    networks: [recovery]
    volumes:
      - backup_repository:/repository
      - recovery_restore:/restore
      - recovery_cache:/cache

networks:
  recovery:
    internal: true

volumes:
  recovery_postgres_data:
  recovery_minio_data:
  recovery_restore:
  recovery_cache:
  backup_repository:
    external: true
    name: svyazka-production_backup_repository
